name: Build SwitchIPTV HUD Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITA64=$DEVKITA64"
          which aarch64-none-elf-g++ || true
          which cmake || true
          which ninja || true
          find /opt/devkitpro -maxdepth 4 -type f -name "aarch64-none-elf-g++" -print || true
          find /opt/devkitpro -maxdepth 4 -type f -name "aarch64-none-elf-gcc" -print || true
          ls -la /opt/devkitpro || true
          ls -la /opt/devkitpro/devkitA64/bin || true
          ls -la /opt/devkitpro/portlibs/switch/lib || true

      - name: Configure
        run: |
          cmake -S . -B build-switch -G Ninja \
            -DPLATFORM_SWITCH=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build NRO
        run: |
          cmake --build build-switch -j2

      - name: Find NRO
        run: |
          find . -name "*.nro" -print

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: switchiptv-1.0.8-HUD-AUDIO-SUBS-REFRESH
          path: |
            **/*.nro
          if-no-files-found: error
